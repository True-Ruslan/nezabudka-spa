name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify approved Nepomka assets
        run: |
          test "$(git hash-object public/branding/danil-hero.webp)" = "680f6b87d4cde66aebca0fcfedca9ab3c07c48af"
          test "$(git hash-object public/branding/nepomka-logo.webp)" = "9ee4c20c66b334e824d219df7ea4d5919d9cbe43"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Quality-gate unit tests
        run: npm run test:quality

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify static build integrity
        run: npm run verify:build

      - name: Prove static verifier rejects broken references and canonical drift
        run: |
          cp dist/index.html /tmp/nepomka-index.html
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'dist/index.html';
          const html = readFileSync(file, 'utf8');
          if (!html.includes('</body>')) throw new Error('Expected closing body tag in generated home page');
          writeFileSync(
            file,
            html.replace(
              '</body>',
              '<img src="/nezabudka-spa/definitely-missing.svg" alt=""></body>',
            ),
          );
          NODE
          if npm run verify:build; then
            echo 'Static verifier accepted a deliberately broken local reference.' >&2
            exit 1
          fi
          mv /tmp/nepomka-index.html dist/index.html
          npm run verify:build

          cp dist/index.html /tmp/nepomka-index.html
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'dist/index.html';
          const html = readFileSync(file, 'utf8');
          const changed = html.replace(
            /(<link[^>]+rel=["']canonical["'][^>]+href=["'])[^"']+(["'])/i,
            '$1https://wrong.example/$2',
          );
          if (changed === html) throw new Error('Expected canonical link in generated home page');
          writeFileSync(file, changed);
          NODE
          if npm run verify:build; then
            echo 'Static verifier accepted a deliberately incorrect canonical URL.' >&2
            exit 1
          fi
          mv /tmp/nepomka-index.html dist/index.html
          npm run verify:build

          cp dist/robots.txt /tmp/nepomka-robots.txt
          sed -i 's#Sitemap: .*#Sitemap: https://wrong.example/sitemap-index.xml#' dist/robots.txt
          if npm run verify:build; then
            echo 'Static verifier accepted an incorrect robots sitemap URL.' >&2
            exit 1
          fi
          mv /tmp/nepomka-robots.txt dist/robots.txt
          npm run verify:build

      - name: Verify project Pages build mode
        run: |
          grep -q 'https://true-ruslan.github.io/nezabudka-spa/' dist/index.html
          grep -q '/nezabudka-spa/branding/nepomka-favicon.png' dist/index.html
          grep -q '/nezabudka-spa/branding/nepomka-logo.webp' dist/index.html
          grep -q '/nezabudka-spa/branding/danil-hero.webp' dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          grep -Fxq 'Sitemap: https://true-ruslan.github.io/nezabudka-spa/sitemap-index.xml' dist/robots.txt
          grep -q '"@type":"BreadcrumbList"' dist/avtopodbor/index.html
          grep -q 'href="/nezabudka-spa/proverka-avto/"' dist/avtopodbor/index.html
          test ! -e dist/cases/case-template/index.html

          for route in avtopodbor proverka-avto bronirovanie-plenkoy tonirovka; do
            test -f "dist/$route/index.html"
            grep -q "https://true-ruslan.github.io/nezabudka-spa/$route/" "dist/$route/index.html"
            grep -R -q --include='sitemap*.xml' "https://true-ruslan.github.io/nezabudka-spa/$route/" dist
          done

      - name: Browser tests
        id: browser-tests
        run: npm run test:e2e

      - name: Prove published case route generation
        run: |
          cat > src/content/cases/case-ci-route-smoke.md <<'EOF'
          ---
          title: "CI route smoke"
          vehicle: "CI fixture"
          context: "Ephemeral build verification"
          summary: "Temporary CI-only content entry used to prove published case routing."
          problem: "Verify route generation."
          investigation: "Build an ephemeral publish:true entry."
          decision: "Require the generated detail page and homepage link."
          rationale: "The repository intentionally contains no real published cases yet."
          result: "The static route exists only inside this runner."
          publish: true
          ---
          EOF

          npm run build
          npm run verify:build
          test -f dist/cases/case-ci-route-smoke/index.html
          grep -q 'CI route smoke' dist/cases/case-ci-route-smoke/index.html
          grep -q 'https://true-ruslan.github.io/nezabudka-spa/cases/case-ci-route-smoke/' dist/cases/case-ci-route-smoke/index.html
          grep -q '/nezabudka-spa/cases/case-ci-route-smoke/' dist/index.html
          test ! -e dist/cases/case-template/index.html

          rm src/content/cases/case-ci-route-smoke.md
          npm run build
          npm run verify:build
          test ! -e dist/cases/case-ci-route-smoke/index.html

      - name: Verify custom-domain build mode
        env:
          SITE_ORIGIN: https://danil.example.test
          BASE_PATH: ''
        run: |
          npm run build
          npm run verify:build
          grep -q 'https://danil.example.test/' dist/index.html
          test -f dist/robots.txt
          grep -Fxq 'Sitemap: https://danil.example.test/sitemap-index.xml' dist/robots.txt
          grep -q '"@type":"BreadcrumbList"' dist/avtopodbor/index.html
          grep -q 'href="/proverka-avto/"' dist/avtopodbor/index.html

          for route in avtopodbor proverka-avto bronirovanie-plenkoy tonirovka; do
            test -f "dist/$route/index.html"
            grep -q "https://danil.example.test/$route/" "dist/$route/index.html"
            grep -R -q --include='sitemap*.xml' "https://danil.example.test/$route/" dist
          done

          if grep -R -q 'true-ruslan.github.io/nezabudka-spa' dist/index.html dist/avtopodbor/index.html dist/proverka-avto/index.html dist/bronirovanie-plenkoy/index.html dist/tonirovka/index.html; then
            echo 'Project Pages URL leaked into custom-domain build.' >&2
            exit 1
          fi
          if grep -R -q '/nezabudka-spa/' dist/index.html dist/avtopodbor/index.html dist/proverka-avto/index.html dist/bronirovanie-plenkoy/index.html dist/tonirovka/index.html; then
            echo 'Project base path leaked into custom-domain build.' >&2
            exit 1
          fi

      - name: Audit external links
        env:
          CHECK_LINK_ROOT: dist
          CHECK_LINK_RETRIES: '2'
          CHECK_LINK_TIMEOUT_MS: '10000'
        run: npm run audit:links

      - name: Accessibility audit with axe
        run: |
          SITE_ORIGIN=http://127.0.0.1:4322 BASE_PATH='' npm run preview -- --host 127.0.0.1 --port 4322 > /tmp/nepomka-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          node --input-type=module <<'NODE'
          const url = 'http://127.0.0.1:4322/';
          for (let attempt = 0; attempt < 60; attempt += 1) {
            try {
              const response = await fetch(url);
              if (response.ok) process.exit(0);
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 500));
          }
          throw new Error(`Preview did not become ready: ${url}`);
          NODE

          axe_bin="$(npm exec --yes --package=@axe-core/cli@4.13.0 -- which axe)"
          axe_source="$(dirname "$(dirname "$axe_bin")")/axe-core/axe.min.js"
          test -f "$axe_source"
          AXE_SOURCE_PATH="$axe_source" \
            A11Y_BASE_URL=http://127.0.0.1:4322/ \
            node scripts/run-axe-audit.mjs

      - name: Lighthouse performance and SEO budgets
        id: lighthouse
        run: npm run audit:lighthouse

      - name: Upload Lighthouse reports
        if: ${{ always() && github.event_name == 'pull_request' && steps.lighthouse.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: artifacts/lighthouse/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload visual baselines
        if: ${{ always() && github.event_name == 'pull_request' && steps.browser-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-screenshots
          path: artifacts/screenshots/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
