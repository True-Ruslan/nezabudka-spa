name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Astro check
        run: npm run check

      - name: Build for configured Pages URL
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Verify generated Pages build
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run verify:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke check published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"

          curl --fail --location --silent --show-error \
            --retry 6 --retry-delay 3 --retry-all-errors \
            "$PAGE_URL" -o /tmp/nepomka-home.html
          grep -q 'Автомобили без догадок' /tmp/nepomka-home.html
          grep -q 'Nepomka' /tmp/nepomka-home.html
          grep -q 'Непомнящий Данил Александрович' /tmp/nepomka-home.html
          if grep -q 'NEZABUDKA' /tmp/nepomka-home.html; then
            echo 'Legacy NEZABUDKA branding is still present in production.' >&2
            exit 1
          fi

          missing_url="${PAGE_URL%/}/__nepomka-v012-404-smoke__"
          status=$(curl --location --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --output /tmp/nepomka-404.html \
            --write-out '%{http_code}' \
            "$missing_url")
          test "$status" = '404'
          grep -q 'Страница не найдена' /tmp/nepomka-404.html
