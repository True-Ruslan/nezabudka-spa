name: Apply contact source change

on:
  push:
    branches: [fix/telegram-max-contact]
    paths:
      - .github/workflows/apply-contact-source.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Apply approved source change
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/data/site.ts',
              "  telegram: string | null;\n  email: string | null;\n  phone: string | null;\n  vk: string;\n  instagram: string;\n",
              "  telegram: string;\n  email: string | null;\n  phone: string | null;\n  instagram: string;\n",
          )
          replace_once(
              'src/data/site.ts',
              "  telegram: null,\n  email: null,\n  phone: '+79045328772',\n  vk: 'https://vk.ru/boypocek',\n  instagram: 'https://www.instagram.com/nepomka.d',\n",
              "  telegram: 'https://t.me/+79045328772',\n  email: null,\n  phone: '+79045328772',\n  instagram: 'https://www.instagram.com/nepomka.d',\n",
          )

          Path('src/components/Contact.astro').write_text('''---
          import ArrowIcon from './ArrowIcon.astro';
          import { contact } from '../data/site';
          const base = import.meta.env.BASE_URL;
          ---
          <section class="contact-section" id="contact" aria-labelledby="contact-title">
            <div class="shell contact-grid">
              <div>
                <p class="section-heading__label">05 / НА СВЯЗИ</p>
                <h2 id="contact-title">Что происходит<br />с вашим автомобилем?</h2>
                <p class="contact-intro">Белгород · онлайн и очно. Ближайшие населённые пункты — по договорённости.</p>
              </div>
              <div class="contact-section__action">
                <a class="button button--light" href={contact.telegram} target="_blank" rel="noopener noreferrer">Написать в Telegram <ArrowIcon direction="up-right" /></a>
                <div class="contact-phone-row" data-contact-phone-row>
                  <a class="contact-phone" href={`tel:${contact.phone}`}>+7 904 532-87-72</a>
                  <span class="contact-max" title="MAX доступен по этому номеру">
                    <img data-max-mark src={`${base}branding/max-mark.svg`} width="30" height="30" alt="" aria-hidden="true" decoding="async" />
                    <span class="visually-hidden">MAX доступен по этому номеру</span>
                  </span>
                </div>
                <p>Для первого сообщения: марка и модель, пробег, ваш вопрос. Смета или список деталей помогут быстрее понять контекст и подтвердить стоимость.</p>
                <a class="contact-social" href={contact.instagram} target="_blank" rel="noopener noreferrer">Instagram · nepomka.d <ArrowIcon direction="up-right" /></a>
              </div>
            </div>
          </section>
          <a class="mobile-contact" href={contact.telegram} target="_blank" rel="noopener noreferrer">Написать Данилу в Telegram <ArrowIcon direction="up-right" /></a>

          <style>
            .contact-phone-row { display: flex; align-items: center; gap: 12px; margin: 24px 0 14px; }
            .contact-phone-row .contact-phone { margin: 0; }
            .contact-max { display: inline-flex; width: 30px; height: 30px; flex: 0 0 auto; align-items: center; justify-content: center; }
            .contact-max img { display: block; width: 100%; height: 100%; }
            .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
          </style>
          '''.replace('\n          ', '\n').lstrip())

          replace_once('src/layouts/BaseLayout.astro', '  sameAs: [contact.vk, contact.instagram],', '  sameAs: [contact.telegram, contact.instagram],')

          replace_once(
              'tests/site.spec.ts',
              "  const vkLink = contact.getByRole('link', { name: /Написать в VK/ });\n  await expect(vkLink).toHaveAttribute('href', 'https://vk.ru/boypocek');\n  await expect(vkLink).toHaveAttribute('target', '_blank');\n  await expect(vkLink).toHaveAttribute('rel', 'noopener noreferrer');",
              "  const telegramLink = contact.getByRole('link', { name: /Написать в Telegram/ });\n  await expect(telegramLink).toHaveAttribute('href', 'https://t.me/+79045328772');\n  await expect(telegramLink).toHaveAttribute('target', '_blank');\n  await expect(telegramLink).toHaveAttribute('rel', 'noopener noreferrer');",
          )
          replace_once(
              'tests/site.spec.ts',
              "  const mobileVkLink = page.locator('.mobile-contact');\n  await expect(mobileVkLink).toHaveAttribute('href', 'https://vk.ru/boypocek');\n  await expect(mobileVkLink).toHaveAttribute('target', '_blank');\n  await expect(mobileVkLink).toHaveAttribute('rel', 'noopener noreferrer');",
              "  const mobileTelegramLink = page.locator('.mobile-contact');\n  await expect(mobileTelegramLink).toHaveAttribute('href', 'https://t.me/+79045328772');\n  await expect(mobileTelegramLink).toHaveAttribute('target', '_blank');\n  await expect(mobileTelegramLink).toHaveAttribute('rel', 'noopener noreferrer');",
          )
          p = Path('tests/service-pages.spec.ts')
          text = p.read_text()
          if text.count('/Написать в VK/') != 2:
              raise SystemExit('Expected exactly two VK assertions in tests/service-pages.spec.ts')
          p.write_text(text.replace('/Написать в VK/', '/Написать в Telegram/'))
          replace_once('tests/arrow-icons.spec.ts', "contact.getByRole('link', { name: /Написать в VK/ })", "contact.getByRole('link', { name: /Написать в Telegram/ })")

          replace_once(
              'docs/CONTENT_GUIDE.md',
              "- `phone` — опубликован;\n- `vk` — опубликован;\n- `instagram` — опубликован;\n- `telegram` — `null`;\n- `email` — `null`.",
              "- `phone` — опубликован;\n- `telegram` — опубликован;\n- `instagram` — опубликован;\n- `email` — `null`.\n\nРядом с телефоном публикуется официальный знак MAX как индикатор доступности этого номера в MAX. До появления подтверждённой персональной MAX-ссылки знак не является ссылкой и не подменяется предположительным URL.",
          )
          replace_once('docs/PROJECT_STATE.md', 'Обновлено: 2026-09-07', 'Обновлено: 2026-09-08')
          replace_once(
              'docs/PROJECT_STATE.md',
              "- телефон;\n- VK;\n- Instagram.\n\nTelegram и email остаются `null` до появления подтверждённых данных и разрешения на публикацию.",
              "- телефон;\n- Telegram (`https://t.me/+79045328772`);\n- Instagram.\n\nРядом с телефоном используется официальный знак MAX как некликабельный индикатор доступности номера в MAX. Неподтверждённая персональная MAX-ссылка не публикуется. Email остаётся `null`.",
          )
          replace_once('docs/ROADMAP.md', '- [x] подтверждённые телефон, VK и Instagram', '- [x] подтверждённые телефон, Telegram и Instagram; MAX отмечен у номера без неподтверждённой профильной ссылки')
          replace_once('README.md', "- `og-cover.png`.\n", "- `og-cover.png`;\n- `max-mark.svg` — официальный знак MAX, локально сохранённый для contact UI.\n")
          PY

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs README.md
          git commit -m 'fix: use Telegram and mark MAX phone availability'
          git push
