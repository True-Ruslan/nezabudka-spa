name: Fetch official MAX brand mark

on:
  push:
    branches: [fix/telegram-max-contact]
    paths:
      - .github/workflows/fetch-max-brand-asset.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Fetch official MAX SVG mark
        run: |
          curl --fail --location --silent --show-error \
            https://max.ru/favicon.svg \
            --output public/branding/max-mark.svg
          grep -q '<svg' public/branding/max-mark.svg
          test "$(wc -c < public/branding/max-mark.svg)" -gt 100

      - name: Commit official asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/branding/max-mark.svg
          git commit -m 'chore: add official MAX brand mark'
          git push
