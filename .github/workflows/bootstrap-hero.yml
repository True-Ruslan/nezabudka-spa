name: Bootstrap hero asset

on:
  push:
    branches:
      - feat/hero-portrait-v2

permissions:
  contents: write

jobs:
  import:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decode approved portrait
        run: |
          cat .tmp/danil-hero/part-* | base64 -d > public/branding/danil-hero.webp
          test "$(git hash-object public/branding/danil-hero.webp)" = "680f6b87d4cde66aebca0fcfedca9ab3c07c48af"

      - name: Commit imported asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/branding/danil-hero.webp
          git commit -m "chore: import portrait-native hero asset"
          git push
